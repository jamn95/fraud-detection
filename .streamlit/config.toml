[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[server]
headless = true
# La dirección de escucha no se fija aquí, para no interferir con Streamlit Cloud ni con Docker.
# En local se limita a este equipo con: streamlit run app/app.py --server.address localhost
maxUploadSize = 50   # MB, para la carga de CSV en la página de predicción

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # oculta el botón "Deploy" y el menú de desarrollador
