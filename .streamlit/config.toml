[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[server]
headless = true
address = "localhost"   # solo accesible desde este equipo; Docker lo abre con --server.address=0.0.0.0
maxUploadSize = 50   # MB, para la carga de CSV en la página de predicción

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # oculta el botón "Deploy" y el menú de desarrollador
